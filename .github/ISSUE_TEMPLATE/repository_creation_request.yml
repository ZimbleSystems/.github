name: 🏗 Create or Fork Repository
description: Automated creation of a brand-new blank repository, or forking any existing reachable repository, under the organization
title: "[REPO-CREATION-REQUEST] "
labels: ["repo-creation-request", "platform-triage"]
type: task

body:
  - type: markdown
    attributes:
      value: |
        ## 📦 Create or Fork Repository

        Please complete all required fields.
        Submitting this issue automatically triggers a workflow that validates your inputs and
        provisions the repository - no manual review needed. If something needs attention, it'll be
        posted back here as a comment on this issue.

  - type: dropdown
    id: product_line
    attributes:
      label: Product Line
      description: Select the product line this repository belongs to
      options:
        - common
        - ewallet
        - hyperconfigurator
        - pos-management
        - reconciliation
        - switching
        - poc
    validations:
      required: true

  - type: dropdown
    id: aspect
    attributes:
      label: Aspect / Domain
      description: Select the primary aspect of this repository
      options:
        - backend
        - frontend
        - endpoint
        - platform
        - testing
        - documentation
        - data
    validations:
      required: true

  - type: dropdown
    id: project_type
    attributes:
      label: Project Type
      description: Select the project/template type for this repository ( DO NOT select category markers )
      options:
        - ------------------------                       
        - --- Backend ---
        - java-maven-library
        - nodejs-express-app
        - python-pyproject-app
        - quarkus-maven-extension
        - quarkus-maven-jdk-app
        - quarkus-maven-native-app
        - spring-maven-jdk-app
        - spring-maven-native-app

        - --- Frontend ---
        - flutter-webapp
        - nextjs-webapp

        - --- Endpoint ---
        - flutter-android-app
        - flutter-ios-app
        - flutter-windows-app
        - golang-windows-app

        - --- Platform ---
        - cicd-util-scripts
        - container-definition
        - gitops
        - helm-charts
        - local-util-scripts
        - python-pyproject
        - python-scripts
        - terraform-modules
        - terraform-scripts

        - --- Testing ---
        - appium-java-scripts
        - appium-js-scripts
        - appium-py-scripts
        - playwright-scripts

        - --- Documentation ---
        - doc

        - --- Data ---
        - config-storage     # PLACEHOLDER - rename to match our actual naming conventions
    validations:
      required: true

  - type: input
    id: repository_name
    attributes:
      label: Repository Name
      description: Enter the desired repository name (kebab-case recommended)
      placeholder: my-awesome-service
    validations:
      required: true

  - type: input
    id: fork_source_url
    attributes:
      label: Source Repository URL (Optional - for forking)
      description: >-
        If this new repository should be a fork of an existing GitHub repository, paste its URL
        here - HTTPS or SSH, with or without a trailing ".git", are all accepted. Leave blank to
        create a new, empty repository instead.
      placeholder: "https://github.com/owner/repo or git@github.com:owner/repo.git"
    validations:
      required: false

  - type: dropdown
    id: tenant_name
    attributes:
      label: Tenant Name (Optional)
      description: Select tenant (choose "None" if not applicable)
      options:
        - 7eleven
        - mercadia
        - petro7
        - telcel
    validations:
      required: false

  - type: textarea
    id: description
    attributes:
      label: Repository Description (Max. 350 characters)
      description: Provide a short description of the repository purpose
      placeholder: This repository will host my awesome microservice.
    validations:
      required: true

  - type: textarea
    id: justification
    attributes:
      label: Business / Technical Justification
      description: Explain why a new repository is required
      placeholder: Separate repo required due to independent deployment lifecycle.
    validations:
      required: true

  - type: checkboxes
    id: compliance
    attributes:
      label: Compliance Checklist
      options:
        - label: Naming convention reviewed
          required: true
        - label: Repository ownership team identified
          required: true
        - label: Security review required
        - label: Infra provisioning required

  # NOTE: README-initialization removed (commented out) when the "Source Repository URL" fork
  # field above was introduced - a forked repository already carries the source repo's content, and
  # this was the only option this field offered. Re-enable by uncommenting below (and the matching
  # logic in handle-repository-creation-request.yml) if a non-README-init use for this field comes
  # up again.
  # - type: checkboxes
  #   id: repository_options
  #   attributes:
  #     label: Repository Options (Optional)
  #     description: Select additional repository options
  #     options:
  #       - label: Initialize repository with README (Do NOT select in case you have already created the project locally with content)

  - type: dropdown
    id: visibility
    attributes:
      label: Repository Visibility
      description: Select visibility level
      options:
        - Private
        - Public
        - Internal (Enterprise only)
    validations:
      required: true
