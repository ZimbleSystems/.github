name: Detect Non-Linear Refs

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "bulk = every eligible repo in the org, selective = only the repos listed below"
        required: true
        default: "bulk"
        type: choice
        options:
          - bulk
          - selective

      target_repos:
        description: "Comma-separated repo names (only used when mode = selective)"
        required: false

      include_archived:
        description: "Also scan archived repositories"
        required: true
        default: false
        type: boolean

      include_forks:
        description: "Also scan forked repositories"
        required: true
        default: false
        type: boolean

      batch_size:
        description: "Repos per scan job — higher means fewer/bigger jobs, lower means more parallelism"
        required: true
        default: "5"

# Only one scan at a time — a re-dispatch supersedes whatever is already
# running instead of doubling up on compute.
concurrency:
  group: detect-non-linear-refs
  cancel-in-progress: true

permissions:
  contents: read

# Governance constants, defined once at the workflow level so the scan job
# and the report job both read the exact same patterns — never two copies
# that could drift apart.
#   PROTECTED_BRANCH_REGEX : main, and any release/* branch. A non-linear
#                            history on one of these is a policy violation
#                            and gets highlighted, not just reported.
#   TAG_PATTERN_REGEX      : semver release tags (vMAJOR.MINOR.PATCH, e.g.
#                            v1.2.3). Bash's POSIX ERE has no \d, so \d is
#                            written as [0-9] — same pattern, portable regex.
env:
  PROTECTED_BRANCH_REGEX: '^(main|release/.*)$'
  TAG_PATTERN_REGEX:      '^v[0-9]+\.[0-9]+\.[0-9]+$'

jobs:

  # ====================================================
  # Job 1: discover eligible repos, split into batches
  # ====================================================
  discover_repositories:
    name: Discover And Batch Repositories
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.build_scan_matrix.outputs.matrix }}
      total:  ${{ steps.build_scan_matrix.outputs.total }}

    steps:

      # --------------------------------------------------
      # Step 1: Generate GitHub App Token
      # --------------------------------------------------

      - name: Generate GitHub App Token
        id: generate_github_app_token
        uses: actions/create-github-app-token@v3
        with:
          client-id:   ${{ secrets.GH_APP_CLIENT_ID || vars.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY || vars.GH_APP_PRIVATE_KEY }}
          owner:       ${{ github.repository_owner }}

      # --------------------------------------------------
      # Step 2: Compute Target Repositories
      # --------------------------------------------------
      # bulk: every repo in the org, filtered to what's actually scannable
      # (forks/archived/disabled/empty repos are skipped unless asked
      # otherwise). selective: validates the comma-separated list against the
      # same eligibility gate, so both modes feed the next step an
      # identically-shaped repo list — one code path, not two.

      - name: Compute Target Repositories
        id: compute_target_repos
        uses: actions/github-script@v9
        env:
          MODE:             ${{ inputs.mode }}
          TARGET_REPOS:     ${{ inputs.target_repos }}
          INCLUDE_ARCHIVED: ${{ inputs.include_archived }}
          INCLUDE_FORKS:    ${{ inputs.include_forks }}
        with:
          github-token: ${{ steps.generate_github_app_token.outputs.token }}
          script: |
            const org              = context.repo.owner;
            const mode             = process.env.MODE;
            const targetReposInput = process.env.TARGET_REPOS;
            const includeArchived  = process.env.INCLUDE_ARCHIVED === "true";
            const includeForks     = process.env.INCLUDE_FORKS === "true";

            core.info(`Mode             : ${mode}`);
            core.info(`Include archived : ${includeArchived}`);
            core.info(`Include forks    : ${includeForks}`);

            if (mode === "selective" && (!targetReposInput || targetReposInput.trim() === "")) {
              core.setFailed("target_repos must be provided in selective mode");
              return;
            }

            // Single eligibility check shared by both modes (DRY) — returns
            // the specific reason a repo is ineligible, or null when it's
            // fine to scan. Both bulk and selective route every repo
            // through this one function, so the reason a repo was skipped
            // can never drift between the two modes or say something vaguer
            // than what was actually checked.
            function ineligibilityReason(repo) {
              if (repo.disabled) return "disabled";
              if (repo.size === 0) return "empty (no commits)";
              if (!includeArchived && repo.archived) return "archived";
              if (!includeForks && repo.fork) return "fork";
              return null;
            }

            function toTarget(repo) {
              return {
                name:          repo.name,
                htmlUrl:       repo.html_url,
                private:       repo.private,
                defaultBranch: repo.default_branch,
              };
            }

            const fs = require("fs");

            let repos = [];

            // Two distinct categories, never merged into one bucket: a repo
            // that EXISTS but fails the eligibility gate (skipped, always
            // with the specific reason from ineligibilityReason) vs. one
            // that couldn't be resolved at all — not found, no access, a
            // typo (invalid; only possible in selective mode, since bulk
            // mode only ever sees repos the org actually has).
            const skippedIneligible = [];
            const invalidRepos      = [];

            if (mode === "bulk") {
              core.info("Fetching all repositories in the organization...");

              const allRepos = await github.paginate(
                github.rest.repos.listForOrg,
                { org, per_page: 100, sort: "full_name", direction: "asc", type: "all" }
              );

              for (const repo of allRepos) {
                const reason = ineligibilityReason(repo);
                if (reason) {
                  skippedIneligible.push({ name: repo.name, htmlUrl: repo.html_url, reason });
                  continue;
                }
                repos.push(toTarget(repo));
              }

              core.info(`Eligible repos : ${repos.length} (of ${allRepos.length} total)`);

              if (repos.length === 0) {
                core.setFailed("No eligible repositories found in organization");
                return;
              }
            } else {
              core.info("Validating provided repositories...");

              const inputRepos = targetReposInput
                .split(",")
                .map(r => r.trim())
                .filter(Boolean);

              if (inputRepos.length === 0) {
                core.setFailed("No valid repositories resolved from input");
                return;
              }

              for (const repo of inputRepos) {
                let data;
                try {
                  ({ data } = await github.rest.repos.get({ owner: org, repo }));
                } catch (err) {
                  const reason = err.message || "not found or inaccessible";
                  core.warning(`Invalid or inaccessible repo : ${repo} (${reason})`);
                  invalidRepos.push({ name: repo, reason });
                  continue;
                }

                const reason = ineligibilityReason(data);
                if (reason) {
                  core.warning(`Skipping ineligible repo : ${repo} (${reason})`);
                  skippedIneligible.push({ name: data.name, htmlUrl: data.html_url, reason });
                  continue;
                }

                repos.push(toTarget(data));
              }

              if (repos.length === 0) {
                core.setFailed("No valid repositories found from input");
                return;
              }
            }

            // One repo per line rather than one long comma-joined string —
            // readable at any repo count, and easy to diff between runs.
            const repoListText = repos.map(r => `  - ${r.name}`).join("\n");
            core.info(`Final repos to scan (${repos.length}):\n${repoListText}`);
            core.setOutput("repos", JSON.stringify(repos));

            if (skippedIneligible.length > 0) {
              const skippedListText = skippedIneligible.map(s => `  - ${s.name} (${s.reason})`).join("\n");
              core.info(`Skipped ineligible repos (${skippedIneligible.length}):\n${skippedListText}`);
            }

            if (invalidRepos.length > 0) {
              const invalidListText = invalidRepos.map(s => `  - ${s.name} (${s.reason})`).join("\n");
              core.info(`Invalid or inaccessible repos (${invalidRepos.length}):\n${invalidListText}`);
            }

            // Job step summary: the same eligible-repo list, rendered as a
            // Markdown table + linked list instead of buried in the raw log.
            // Skipped and invalid repos each get their own section — one
            // entry per line, carrying the specific reason — instead of one
            // comma-joined blob that hid both which repo and why.
            if (process.env.GITHUB_STEP_SUMMARY) {
              const summaryLines = [
                "### 🎯 Target Repositories",
                "",
                "| Mode | Include Archived | Include Forks | Eligible Repos |",
                "| --- | --- | --- | --- |",
                `| ${mode} | ${includeArchived} | ${includeForks} | ${repos.length} |`,
                "",
              ];

              if (repos.length > 0) {
                summaryLines.push(...repos.map(r => `- [${r.name}](${r.htmlUrl})`), "");
              }

              if (skippedIneligible.length > 0) {
                summaryLines.push(`> ⚠️ **Skipped (ineligible)** — ${skippedIneligible.length}:`);
                summaryLines.push(...skippedIneligible.map(s => `> - [\`${s.name}\`](${s.htmlUrl}) — ${s.reason}`));
                summaryLines.push("");
              }

              if (invalidRepos.length > 0) {
                summaryLines.push(`> ❌ **Invalid or inaccessible** — ${invalidRepos.length}:`);
                summaryLines.push(...invalidRepos.map(s => `> - \`${s.name}\` — ${s.reason}`));
                summaryLines.push("");
              }

              fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summaryLines.join("\n") + "\n");
            }

      # --------------------------------------------------
      # Step 3: Build Scan Matrix
      # --------------------------------------------------
      # Chunks the repo list into fixed-size batches so the next job fans out
      # as one Actions job per BATCH instead of one per repo — bounded
      # parallelism and far less per-job runner startup overhead, for the
      # same total scanning work.

      - name: Build Scan Matrix
        id: build_scan_matrix
        uses: actions/github-script@v9
        env:
          REPOS:      ${{ steps.compute_target_repos.outputs.repos }}
          BATCH_SIZE: ${{ inputs.batch_size }}
        with:
          script: |
            const repos     = JSON.parse(process.env.REPOS || "[]");
            const batchSize = Math.max(1, parseInt(process.env.BATCH_SIZE, 10) || 5);

            const matrix = [];
            for (let i = 0; i < repos.length; i += batchSize) {
              matrix.push(repos.slice(i, i + batchSize));
            }

            core.info(`Total repos   : ${repos.length}`);
            core.info(`Batch size    : ${batchSize}`);
            core.info(`Total batches : ${matrix.length}`);

            core.setOutput("matrix", JSON.stringify(matrix));
            core.setOutput("total", String(repos.length));

  # ====================================================
  # Job 2: scan each batch for merge commits / linearity
  # (branches and matching tags alike)
  # ====================================================
  scan_repositories:
    name: Scan Batch For Non-Linear Refs
    needs: discover_repositories
    if: success() && needs.discover_repositories.outputs.total != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        batch: ${{ fromJson(needs.discover_repositories.outputs.matrix) }}

    steps:

      # --------------------------------------------------
      # Step 1: Generate GitHub App Token
      # --------------------------------------------------

      - name: Generate GitHub App Token
        id: generate_github_app_token
        uses: actions/create-github-app-token@v3
        with:
          client-id:   ${{ secrets.GH_APP_CLIENT_ID || vars.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY || vars.GH_APP_PRIVATE_KEY }}
          owner:       ${{ github.repository_owner }}

      # --------------------------------------------------
      # Step 2: Scan Batch For Non-Linear Refs
      # --------------------------------------------------
      # Bare clone with `--filter=blob:none` (a "blobless" partial clone):
      # every commit and tree object comes across, but no file content.
      # Trees are tiny (filenames + SHAs); blobs are where the real weight
      # lives (source, binaries, build artifacts) and this skips them
      # entirely. That's everything `git rev-list --min-parents=2` needs to
      # find merge commits, at a fraction of a full clone's transfer size —
      # GitHub's Git servers support this filter over HTTPS. One clone per
      # repo (not per branch/tag) since `--bare` already brings every ref,
      # so shared history is never fetched twice. Every branch is analyzed
      # (no cap) — tags are filtered to TAG_PATTERN_REGEX first, since most
      # tags in a repo are never release tags.

      - name: Scan Batch For Non-Linear Refs
        id: scan_batch
        env:
          ORG:                     ${{ github.repository_owner }}
          TOKEN:                   ${{ steps.generate_github_app_token.outputs.token }}
          BATCH:                   ${{ toJson(matrix.batch) }}
          JOB_INDEX:               ${{ strategy.job-index }}
          PROTECTED_BRANCH_REGEX:  ${{ env.PROTECTED_BRANCH_REGEX }}
          TAG_PATTERN_REGEX:       ${{ env.TAG_PATTERN_REGEX }}
        run: |
          set -euo pipefail

          # Every batch writes to a file named after ITS OWN job index, not a
          # fixed "results.json". The report job downloads every batch's
          # artifact into one shared folder with merge-multiple: true — if
          # every artifact contained a same-named file, each download would
          # silently overwrite the last, leaving only one batch's worth of
          # repos in the merged results with no error anywhere. Naming this
          # per-batch is what lets all of them coexist after the merge.
          RESULTS_FILE="results-${JOB_INDEX}.json"

          echo "$BATCH" | jq -c '.[]' > repos.jsonl
          : > results.jsonl

          # ------------------------------------------------------------------
          # analyze_ref <ref> -> {hasLinearHistory, mergeCount, mergeCommits}
          # Shared by branches and tags below so the actual linearity check
          # (and the merge-commit list it returns) lives in exactly one place.
          # Called only from inside scan_repo, which has already turned off
          # -e (see below) — a ref git can't make sense of just returns
          # non-zero here instead of tearing down the batch.
          # ------------------------------------------------------------------
          analyze_ref() {
            local ref="$1"
            local merge_count is_linear merge_commits

            merge_count=$(git rev-list --min-parents=2 --count "$ref") || return 1
            is_linear="true"
            [ "$merge_count" -gt 0 ] && is_linear="false"

            # Capped to the 10 most recent merge commits per ref — a ref with
            # hundreds of merges only needs enough evidence to prove it's
            # non-linear, not an exhaustive dump. mergeCount (uncapped) still
            # carries the true total for a "+N more" note in the report.
            merge_commits="[]"
            if [ "$merge_count" -gt 0 ]; then
              merge_commits=$(git log --merges --format='%H|%h' "$ref" | head -n 10 | jq -R -s -c --arg url "$html_url" '
                split("\n") | map(select(length > 0)) | map(split("|")) |
                map({sha: .[1], url: ($url + "/commit/" + .[0])})
              ') || return 1
            fi

            jq -c -n \
              --argjson linear "$is_linear" \
              --argjson mergeCount "$merge_count" \
              --argjson mergeCommits "$merge_commits" \
              '{hasLinearHistory: $linear, mergeCount: $mergeCount, mergeCommits: $mergeCommits}'
          }

          # ------------------------------------------------------------------
          # scan_repo <repo-json-line> -> appends exactly one JSON object to
          # results.jsonl, then returns 0. This is the fix for a real bug: with
          # `set -e` active, ONE unexpected failure anywhere in here — a
          # malformed ref, a transient git error, anything not already
          # explicitly guarded — used to abort the ENTIRE batch script before
          # it ever reached "Upload Batch Results", silently dropping every
          # repo in that batch (not just the one that broke) from the report.
          # `set +e` + `trap 'set -e' RETURN` scopes errexit OFF for the
          # duration of this function only (bash restores it the instant the
          # function returns, on every path), so a failure anywhere inside —
          # the clone, a single ref, an unexpected git/jq hiccup — is caught
          # explicitly below and turned into a partial/error result instead of
          # taking the rest of the batch down with it.
          # ------------------------------------------------------------------
          scan_repo() {
            trap 'set -e' RETURN
            set +e

            local repo_json="$1"
            local name html_url workdir
            local branch_results branches branch is_protected stats
            local tag_results all_tags tag
            local branch_count tag_count

            name=$(echo "$repo_json" | jq -r '.name // empty')
            html_url=$(echo "$repo_json" | jq -r '.htmlUrl // empty')

            echo ""
            echo "=================================================="
            echo "🔍 Scanning ${name:-<unknown>}"
            echo "=================================================="

            if [ -z "$name" ]; then
              echo "❌ Could not read repo name from batch entry — skipping"
              jq -n --arg url "${html_url:-}" --arg err "Malformed batch entry (missing name)" \
                '{repo: "unknown", htmlUrl: $url, error: $err, branches: [], tags: []}' >> results.jsonl
              return 0
            fi

            workdir="clone-${name//\//_}"
            rm -rf "$workdir"

            # 300s cap: a single stalled/slow clone can't eat the whole
            # batch's time budget and starve the other repos in it.
            if ! timeout 300 git clone --bare --filter=blob:none --quiet \
                "https://x-access-token:${TOKEN}@github.com/${ORG}/${name}.git" "$workdir" 2>clone-error.log; then
              err=$(tr '\n' ' ' < clone-error.log | sed 's/"/\\"/g' | cut -c1-300)
              echo "❌ Clone failed for ${name}: ${err}"
              jq -n --arg repo "$name" --arg url "$html_url" --arg err "$err" \
                '{repo: $repo, htmlUrl: $url, error: $err, branches: [], tags: []}' >> results.jsonl
              rm -rf "$workdir" clone-error.log
              return 0
            fi
            rm -f clone-error.log

            pushd "$workdir" > /dev/null

            # ---- branches: every branch, none skipped ----
            branch_results="[]"
            branches=$(git for-each-ref --format='%(refname:short)' refs/heads/ | sort)

            while IFS= read -r branch; do
              [ -z "$branch" ] && continue

              is_protected="false"
              [[ "$branch" =~ $PROTECTED_BRANCH_REGEX ]] && is_protected="true"

              if ! stats=$(analyze_ref "$branch"); then
                echo "⚠️ Could not analyze branch ${branch} in ${name} — skipping it, continuing with the rest"
                continue
              fi

              branch_results=$(echo "$branch_results" | jq -c \
                --arg branch "$branch" --argjson protected "$is_protected" --argjson stats "$stats" \
                '. + [$stats + {branch: $branch, protected: $protected}]')
            done <<< "$branches"

            # ---- tags: only those matching TAG_PATTERN_REGEX (semver releases) ----
            tag_results="[]"
            all_tags=$(git for-each-ref --format='%(refname:short)' refs/tags/ | sort)

            while IFS= read -r tag; do
              [ -z "$tag" ] && continue
              [[ "$tag" =~ $TAG_PATTERN_REGEX ]] || continue

              if ! stats=$(analyze_ref "$tag"); then
                echo "⚠️ Could not analyze tag ${tag} in ${name} — skipping it, continuing with the rest"
                continue
              fi

              tag_results=$(echo "$tag_results" | jq -c \
                --arg tag "$tag" --argjson stats "$stats" \
                '. + [$stats + {tag: $tag}]')
            done <<< "$all_tags"

            popd > /dev/null
            rm -rf "$workdir"

            jq -n --arg repo "$name" --arg url "$html_url" \
                  --argjson branches "$branch_results" --argjson tags "$tag_results" \
                  '{repo: $repo, htmlUrl: $url, branches: $branches, tags: $tags}' \
                  >> results.jsonl

            branch_count=$(echo "$branch_results" | jq 'length')
            tag_count=$(echo "$tag_results" | jq 'length')
            echo "✅ Done: ${name} (${branch_count} branch(es), ${tag_count} matching tag(s))"
          }

          while IFS= read -r repo_json; do
            # Belt-and-suspenders: scan_repo already catches everything it
            # knows how to expect, but if it still returns non-zero for some
            # truly unanticipated reason, that repo is recorded as an error
            # rather than the rest of the batch quietly disappearing with it.
            if ! scan_repo "$repo_json"; then
              name=$(echo "$repo_json" | jq -r '.name // "unknown"' 2>/dev/null || echo "unknown")
              echo "❌ Unexpected failure scanning ${name} — recording it as an error and moving on"
              jq -n --arg repo "$name" --arg err "Unexpected script error while scanning this repository (see workflow logs for this batch)" \
                '{repo: $repo, htmlUrl: "", error: $err, branches: [], tags: []}' >> results.jsonl
            fi
          done < repos.jsonl

          jq -s '.' results.jsonl > "$RESULTS_FILE" 2>/dev/null || echo '[]' > "$RESULTS_FILE"
          echo "ℹ️ Batch complete. Repos processed: $(jq 'length' "$RESULTS_FILE")"

      # --------------------------------------------------
      # Step 3: Upload Batch Results
      # --------------------------------------------------
      # Matrix job outputs can't be aggregated directly (each matrix leg's
      # output just overwrites the last one Actions recorded), so every batch
      # writes its results to its own artifact instead — the report job
      # below downloads and merges them. `if: always()` + `if-no-files-found:
      # warn` mean that even if the scan step above somehow still fails
      # outright, whatever partial results file exists gets uploaded (or the
      # batch is just skipped with a warning) rather than one bad batch
      # silently costing every repo assigned to it. The artifact name AND the
      # file it contains are both keyed by job-index — the report job
      # downloads every batch's artifact into one shared folder with
      # merge-multiple: true, and if every artifact held a same-named file
      # (e.g. results.json), each download would silently clobber the last,
      # leaving only one batch's repos in the merged report with no error
      # anywhere to point at why.

      - name: Upload Batch Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name:               non-linear-refs-batch-${{ strategy.job-index }}
          path:               results-${{ strategy.job-index }}.json
          retention-days:     14
          if-no-files-found:  warn

  # ====================================================
  # Job 3: merge every batch's results into one report
  # ====================================================
  generate_report:
    name: Generate Non-Linear Refs Report
    needs: [discover_repositories, scan_repositories]
    if: always() && needs.discover_repositories.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:

      # --------------------------------------------------
      # Step 1: Download Batch Results
      # --------------------------------------------------

      - name: Download Batch Results
        uses: actions/download-artifact@v8
        with:
          pattern:        non-linear-refs-batch-*
          path:           results
          merge-multiple: true

      # --------------------------------------------------
      # Step 2: Install Report Dependencies
      # --------------------------------------------------
      # actions/github-script has no spreadsheet library built in, but it CAN
      # require() a package installed into the job's working directory by a
      # prior step — exactly what this does. Installed here (not committed to
      # the repo) so the version is pinned in one place and never drifts from
      # what the next step expects.

      - name: Install Report Dependencies
        run: npm install exceljs@4.4.0 --no-save

      # --------------------------------------------------
      # Step 3: Build Non-Linear Refs Report
      # --------------------------------------------------
      # One repo per section (linked), a Branches table and a Tags table,
      # columns: ref / has linear history (color-coded badge) / merge commits
      # (linked, capped, with a "+N more" note). The "Has Linear History"
      # badge always shows the same label text ("history: linear" /
      # "history: non-linear") — severity is conveyed by color alone
      # (brightgreen/red/critical), never by swapping the label. A protected
      # ref instead gets a distinct shield icon in the Branch/Tag column
      # itself, and that icon changes shape when the ref is ALSO non-linear —
      # that combination is a policy violation, both inline on the repo and
      # rolled up into one org-wide violations table up top (covering every
      # non-linear branch AND tag, not only protected ones), so a policy
      # breach is never buried in a big table. Every tag in this report
      # already matched TAG_PATTERN_REGEX (a semver release tag), so tags are
      # treated as protected the same way a release branch is — a merge
      # commit in a released version's history is exactly what this workflow
      # exists to catch.

      - name: Build Non-Linear Refs Report
        id: build_report
        uses: actions/github-script@v9
        env:
          ORG:                    ${{ github.repository_owner }}
          PROTECTED_BRANCH_REGEX: ${{ env.PROTECTED_BRANCH_REGEX }}
          TAG_PATTERN_REGEX:      ${{ env.TAG_PATTERN_REGEX }}
          TOTAL_ELIGIBLE:         ${{ needs.discover_repositories.outputs.total }}
          SCAN_JOB_RESULT:        ${{ needs.scan_repositories.result }}
        with:
          script: |
            const fs      = require("fs");
            const path    = require("path");
            const ExcelJS = require("exceljs");

            // Unique file names — the date + run number embedded in both
            // paths below — so downloading reports from several runs into
            // the same folder never overwrites an earlier one.
            const runNumber    = context.runNumber;
            const dateStamp    = new Date().toISOString().slice(0, 10); // YYYY-MM-DD, UTC
            const uniqueSuffix = `${dateStamp}-run${runNumber}`;
            const mdPath       = `non-linear-refs-report-${uniqueSuffix}.md`;
            const xlsxPath     = `non-linear-refs-violations-${uniqueSuffix}.xlsx`;

            // Color coding, done as shields.io badges — GitHub strips inline
            // CSS from rendered Markdown, so a real badge image is what
            // actually reads as "green = fine, red = not fine" rather than
            // plain text. One shared badge builder, three fixed badges — the
            // LABEL text is always "history: ..." for all three; only the
            // color escalates for a protected-ref violation. Keeping the
            // label constant is what makes the column itself consistent to
            // read; the shield icon on the ref name (below) is what flags
            // "this one specifically is a policy violation".
            const badge = (label, message, color) =>
              `![${label}: ${message}](https://img.shields.io/badge/${label}-${message.replace(/-/g, "--")}-${color})`;

            // Label-less variant — just the colored message, no repeated
            // "label:" prefix baked into the image. Used only for the
            // severity badges below, which already sit under a "Severity"
            // column header; repeating that word inside the badge itself
            // would just be noise next to the header.
            const plainBadge = (message, color) =>
              `![${message}](https://img.shields.io/badge/${message.replace(/-/g, "--")}-${color})`;

            const LINEAR_BADGE    = badge("history", "linear", "brightgreen");
            const NONLINEAR_BADGE = badge("history", "non-linear", "red");
            const VIOLATION_BADGE = badge("history", "non-linear", "critical");

            // Repo-level severity badges for the top-of-report rollup table
            // (below): GitHub strips row/cell background colors from
            // rendered Markdown, so a badge is what actually carries the
            // "this repo matters more" signal. A deliberately darker shade
            // for a repo with at least one PROTECTED violation (the real
            // policy breach) vs. a lighter shade for a repo whose non-linear
            // refs are all unprotected (informational, not a breach).
            const SEVERITY_PROTECTED_BADGE   = plainBadge("protected-violation", "b30000");
            // Lighter shade of the same red family as the protected badge
            // above (was amber) — shields.io picks the message text color
            // automatically for contrast, so no separate font-color knob is
            // needed here; the Excel companion below sets one explicitly
            // since xlsx has no such auto-contrast.
            const SEVERITY_UNPROTECTED_BADGE = plainBadge("unprotected-only", "ef9a9a");

            function historyCell(hasLinearHistory, isViolation) {
              if (isViolation) return VIOLATION_BADGE;
              return hasLinearHistory ? LINEAR_BADGE : NONLINEAR_BADGE;
            }

            // Renders a branch/tag name with a shield icon that reflects its
            // protection + linearity status, instead of a badge whose LABEL
            // text used to change ("PROTECTED" vs "history") depending on
            // whether the ref was a violation — the inconsistency flagged in
            // review. Three states: unprotected (plain name), protected +
            // linear (🛡️, business as usual), protected + non-linear (🚨🛡️,
            // an actual policy violation).
            function refLabel(ref, isProtected, hasLinearHistory) {
              if (isProtected && !hasLinearHistory) return `🚨🛡️ \`${ref}\``;
              if (isProtected) return `🛡️ \`${ref}\``;
              return `\`${ref}\``;
            }

            function mergeCell(entry) {
              if (!entry.mergeCommits || entry.mergeCommits.length === 0) return "-";
              const shown = entry.mergeCommits.map(c => `[${c.sha}](${c.url})`).join(", ");
              const extra = entry.mergeCount - entry.mergeCommits.length;
              return extra > 0 ? `${shown}, +${extra} more` : shown;
            }

            const dir   = "results";
            const files = fs.existsSync(dir)
              ? fs.readdirSync(dir).filter(f => f.endsWith(".json"))
              : [];

            let repos = [];
            for (const file of files) {
              try {
                const chunk = JSON.parse(fs.readFileSync(path.join(dir, file), "utf8"));
                repos = repos.concat(chunk);
              } catch (err) {
                core.warning(`⚠️ Could not parse ${file}: ${err.message}`);
              }
            }

            repos.sort((a, b) => a.repo.localeCompare(b.repo));
            core.info(`Repos in report : ${repos.length}`);

            // Defense-in-depth against a partial report looking like a
            // complete one: if the scan job was cancelled/superseded (e.g.
            // by a newer dispatch hitting the workflow's concurrency group)
            // partway through, or otherwise didn't finish every batch, this
            // step still runs (needed for a best-effort report on genuine
            // per-repo failures) but the repo count here would silently fall
            // short of what discovery found. Comparing the two and shouting
            // about any gap is what makes that visible instead of the report
            // quietly reading as "complete" with most repos missing.
            const totalEligible = parseInt(process.env.TOTAL_ELIGIBLE || "0", 10) || 0;
            const scanJobResult = process.env.SCAN_JOB_RESULT || "unknown";
            const incomplete    = totalEligible > 0 && repos.length < totalEligible;

            if (incomplete) {
              core.warning(
                `Incomplete scan: report covers ${repos.length} of ${totalEligible} eligible repos ` +
                `(scan job result: ${scanJobResult}). See the job summary for details.`
              );
            }

            const repoLines = [];
            // Every non-linear ref across every repo — branches AND tags,
            // protected or not. `protected` here means "policy applies":
            // true for a branch matching PROTECTED_BRANCH_REGEX, and always
            // true for a tag (every tag reaching this report already
            // matched TAG_PATTERN_REGEX, i.e. it's a semver release).
            const allViolations = [];
            let totalBranches = 0, linearBranches = 0;
            let totalTags = 0, linearTags = 0, reposWithErrors = 0;

            for (const r of repos) {
              repoLines.push(`### [${r.repo}](${r.htmlUrl})`, "");

              if (r.error) {
                reposWithErrors++;
                repoLines.push(`> ❌ Could not scan this repository: ${r.error}`, "");
                continue;
              }

              const repoBranchViolations       = (r.branches || []).filter(b => b.protected && !b.hasLinearHistory);
              const repoUnprotectedBranchIssues = (r.branches || []).filter(b => !b.protected && !b.hasLinearHistory);
              const repoTagViolations           = (r.tags || []).filter(t => !t.hasLinearHistory);

              for (const v of repoBranchViolations) {
                allViolations.push({ repo: r.repo, htmlUrl: r.htmlUrl, ref: v.branch, refType: "branch", protected: true, mergeCount: v.mergeCount, mergeCommits: v.mergeCommits });
              }
              for (const v of repoUnprotectedBranchIssues) {
                allViolations.push({ repo: r.repo, htmlUrl: r.htmlUrl, ref: v.branch, refType: "branch", protected: false, mergeCount: v.mergeCount, mergeCommits: v.mergeCommits });
              }
              for (const v of repoTagViolations) {
                allViolations.push({ repo: r.repo, htmlUrl: r.htmlUrl, ref: v.tag, refType: "tag", protected: true, mergeCount: v.mergeCount, mergeCommits: v.mergeCommits });
              }

              if (repoBranchViolations.length > 0 || repoTagViolations.length > 0) {
                const refsText = [
                  ...repoBranchViolations.map(b => `\`${b.branch}\` (branch)`),
                  ...repoTagViolations.map(t => `\`${t.tag}\` (tag)`),
                ].join(", ");
                repoLines.push(`> 🚨 **Protected ref policy violation** — non-linear history on: ${refsText}`, "");
              }

              repoLines.push("**Branches**", "");
              repoLines.push("| Branch | Has Linear History | Merge Commits |");
              repoLines.push("| --- | --- | --- |");

              for (const b of (r.branches || [])) {
                totalBranches++;
                if (b.hasLinearHistory) linearBranches++;

                const isViolation = b.protected && !b.hasLinearHistory;
                repoLines.push(`| ${refLabel(b.branch, b.protected, b.hasLinearHistory)} | ${historyCell(b.hasLinearHistory, isViolation)} | ${mergeCell(b)} |`);
              }
              repoLines.push("");

              repoLines.push("**Tags**", "");
              if (!r.tags || r.tags.length === 0) {
                repoLines.push("_No tags matching `v<major>.<minor>.<patch>` found._", "");
              } else {
                repoLines.push("| Tag | Has Linear History | Merge Commits |");
                repoLines.push("| --- | --- | --- |");

                for (const t of r.tags) {
                  totalTags++;
                  if (t.hasLinearHistory) linearTags++;

                  // Every tag here already matched TAG_PATTERN_REGEX (a
                  // release tag) — treated as protected the same way a
                  // release branch is.
                  const isViolation = !t.hasLinearHistory;
                  repoLines.push(`| ${refLabel(t.tag, true, t.hasLinearHistory)} | ${historyCell(t.hasLinearHistory, isViolation)} | ${mergeCell(t)} |`);
                }
                repoLines.push("");
              }
            }

            const header = [
              `## 📊 Non-Linear Refs Report — \`${process.env.ORG}\``,
              "",
              `Protected branches: \`${process.env.PROTECTED_BRANCH_REGEX}\`. Tags analyzed: those matching \`${process.env.TAG_PATTERN_REGEX}\` (semver releases).`,
              "A history is **linear** only when none of its commits — from the root to the tip — is a merge commit.",
              "",
            ];

            if (incomplete) {
              header.push(
                `> ⚠️ **Incomplete scan** — this report covers only ${repos.length} of ${totalEligible} eligible repositories (scan job result: \`${scanJobResult}\`).`,
                "> This usually means the run was cancelled or superseded by a newer dispatch before every batch finished. Check the \"Scan Batch For Non-Linear Refs\" job logs for this run, or re-run the workflow.",
                ""
              );
            }

            const protectedViolationCount = allViolations.filter(v => v.protected).length;

            // Lets "Upload Excel Violations Summary" (below) decide, via
            // `if:`, whether to run at all — a run with zero violations
            // never writes the .xlsx, so that step shouldn't even attempt
            // it rather than running and immediately finding nothing.
            core.setOutput("has_violations", allViolations.length > 0 ? "true" : "false");

            header.push(
              "| Repos scanned | Branches scanned | Tags scanned | Fully linear branches | Fully linear tags | Total violations | Protected violations | Repos with errors |",
              "| --- | --- | --- | --- | --- | --- | --- | --- |",
              `| ${repos.length} | ${totalBranches} | ${totalTags} | ${linearBranches} / ${totalBranches} | ${linearTags} / ${totalTags} | ${allViolations.length} | ${protectedViolationCount} | ${reposWithErrors} |`,
              ""
            );

            if (allViolations.length > 0) {
              // Group every violating ref by repo so the rollup table reads
              // as one block per repo instead of interleaved rows — GitHub
              // Markdown tables have no real rowspan, so a blank repo/
              // severity cell on every row after a group's first is the
              // closest a Markdown table gets to Excel's merged cells.
              const violationsByRepo = new Map();
              for (const v of allViolations) {
                if (!violationsByRepo.has(v.repo)) {
                  violationsByRepo.set(v.repo, { htmlUrl: v.htmlUrl, refs: [] });
                }
                violationsByRepo.get(v.repo).refs.push(v);
              }

              const repoGroups = Array.from(violationsByRepo.entries()).map(([repo, data]) => {
                // Protected refs first within the group, so the actual
                // policy breach (if any) is the first thing seen for that repo.
                data.refs.sort((a, b) => {
                  if (a.protected !== b.protected) return a.protected ? -1 : 1;
                  return a.ref.localeCompare(b.ref);
                });
                return { repo, htmlUrl: data.htmlUrl, refs: data.refs, hasProtected: data.refs.some(r => r.protected) };
              });

              // Repos with a protected violation sort to the top as a block
              // (the darker severity badge below matches this ordering),
              // then alphabetically within each severity tier.
              repoGroups.sort((a, b) => {
                if (a.hasProtected !== b.hasProtected) return a.hasProtected ? -1 : 1;
                return a.repo.localeCompare(b.repo);
              });

              header.push(
                "### 🚨 Non-Linear History Violations",
                "",
                "Every branch or tag with at least one merge commit in its history, grouped by repo — not just protected ones. " +
                  "The **severity** badge is repo-level: a darker red `protected-violation` badge means at least one of that repo's " +
                  "non-linear refs is protected (a real policy breach, listed first); a lighter red `unprotected-only` badge means " +
                  "every non-linear ref there is unprotected (informational). 🚨🛡️ on an individual ref marks it as protected — " +
                  "a branch matching `PROTECTED_BRANCH_REGEX`, or any tag in this report (every tag here already matched the release " +
                  "pattern `TAG_PATTERN_REGEX`).",
                "",
                "| Repo | Severity | Ref | Type | Merge Commits |",
                "| --- | --- | --- | --- | --- |"
              );
              for (const g of repoGroups) {
                const severityBadge = g.hasProtected ? SEVERITY_PROTECTED_BADGE : SEVERITY_UNPROTECTED_BADGE;
                g.refs.forEach((v, i) => {
                  const repoCell     = i === 0 ? `[\`${g.repo}\`](${g.htmlUrl})` : "";
                  const severityCell = i === 0 ? severityBadge : "";
                  header.push(`| ${repoCell} | ${severityCell} | ${refLabel(v.ref, v.protected, false)} | ${v.refType} | ${mergeCell(v)} |`);
                });
              }
              header.push(
                "",
                `📎 A color-formatted Excel version of this table (\`${xlsxPath}\`, with real merged repo/severity ` +
                  "cells and real cell colors — this Markdown table can only approximate both) is attached to this run's artifacts.",
                ""
              );

              // ------------------------------------------------------------
              // Excel companion to the table above. Same repoGroups, so the
              // grouping/sort order can never drift between the two — this
              // is just a second renderer of data already computed once.
              // Unlike Markdown, xlsx has no rendering restrictions, so the
              // color-coding and repo/severity cell merging originally asked
              // for can be the real thing here instead of an approximation:
              // true merged cells (sheet.mergeCells) and true cell fill
              // colors, not a blank-cell trick or a badge image standing in
              // for color.
              // ------------------------------------------------------------
              const workbook = new ExcelJS.Workbook();
              const sheet    = workbook.addWorksheet("Violations", {
                views: [{ state: "frozen", ySplit: 1 }],
              });

              sheet.columns = [
                { header: "Repo",          key: "repo",         width: 34 },
                { header: "Severity",      key: "severity",     width: 20 },
                { header: "Ref",           key: "ref",          width: 30 },
                { header: "Type",          key: "type",         width: 10 },
                { header: "Protected",     key: "protected",    width: 12 },
                { header: "Merge Commits", key: "mergeCommits", width: 60 },
              ];

              const headerRow = sheet.getRow(1);
              headerRow.font = { bold: true, color: { argb: "FFFFFFFF" } };
              headerRow.fill = { type: "pattern", pattern: "solid", fgColor: { argb: "FF37474F" } };
              headerRow.alignment = { vertical: "middle" };

              // Darker tint for a repo with a real protected-ref breach,
              // lighter for one whose non-linear refs are all unprotected —
              // the same distinction the Markdown severity badge draws,
              // applied here as an actual row background instead of an image.
              // Both are now shades of the same red family (previously the
              // unprotected tier used amber/yellow) — a dark red font on the
              // lighter badge fill keeps that text readable against it, the
              // way shields.io auto-picks a contrasting color for the
              // Markdown badge above.
              const PROTECTED_ROW_FILL     = "FFF8D7DA";
              const UNPROTECTED_ROW_FILL   = "FFFDEEEE";
              const PROTECTED_BADGE_FILL   = "FFB30000";
              const UNPROTECTED_BADGE_FILL = "FFEF9A9A";
              const UNPROTECTED_BADGE_FONT = "FFB71C1C";
              const THIN_GREY_BORDER = { style: "thin", color: { argb: "FFBDBDBD" } };

              // Shared row styling (fill/alignment/border) — used for both a
              // ref's real merge-commit rows and its "+N more" summary row
              // below, so the two never drift out of sync.
              function styleRow(row, fill) {
                row.eachCell((cell) => {
                  cell.fill      = { type: "pattern", pattern: "solid", fgColor: { argb: fill } };
                  cell.alignment = { vertical: "middle", wrapText: true };
                  cell.border    = { top: THIN_GREY_BORDER, left: THIN_GREY_BORDER, bottom: THIN_GREY_BORDER, right: THIN_GREY_BORDER };
                });
              }

              let excelRow = 2; // row 1 is the header
              for (const g of repoGroups) {
                const groupStartRow = excelRow;
                const rowFill      = g.hasProtected ? PROTECTED_ROW_FILL   : UNPROTECTED_ROW_FILL;
                const badgeFill    = g.hasProtected ? PROTECTED_BADGE_FILL : UNPROTECTED_BADGE_FILL;
                const badgeFont    = g.hasProtected ? "FFFFFFFF" : UNPROTECTED_BADGE_FONT;
                const severityText = g.hasProtected ? "PROTECTED VIOLATION" : "UNPROTECTED ONLY";

                for (const v of g.refs) {
                  const refStartRow = excelRow;

                  // One row per merge commit so each SHA can carry a real,
                  // individual hyperlink — a single Excel cell only ever
                  // supports one hyperlink, unlike the Markdown table's
                  // comma-joined `[sha](url), [sha](url)` cell, so a ref
                  // with several merge commits now spans several rows
                  // instead of losing all but one link.
                  const commits = (v.mergeCommits && v.mergeCommits.length > 0) ? v.mergeCommits : [null];
                  for (const c of commits) {
                    const row = sheet.addRow({
                      repo:         g.repo,
                      severity:     severityText,
                      ref:          v.ref,
                      type:         v.refType,
                      protected:    v.protected ? "Yes" : "No",
                      mergeCommits: c ? c.sha : "-",
                    });

                    styleRow(row, rowFill);

                    const repoCell = row.getCell("repo");
                    repoCell.value = { text: g.repo, hyperlink: g.htmlUrl };
                    repoCell.font  = { underline: true, color: { argb: "FF0563C1" } };

                    if (c) {
                      const commitCell = row.getCell("mergeCommits");
                      commitCell.value = { text: c.sha, hyperlink: c.url };
                      commitCell.font  = { underline: true, color: { argb: "FF0563C1" } };
                    }

                    excelRow++;
                  }

                  // mergeCount is uncapped; mergeCommits is capped to the 10
                  // most recent (see analyze_ref) — this extra row is the
                  // Excel equivalent of mergeCell()'s "+N more" note in the
                  // Markdown table.
                  const shownCount = v.mergeCommits ? v.mergeCommits.length : 0;
                  const extraCount = v.mergeCount - shownCount;
                  if (extraCount > 0) {
                    const row = sheet.addRow({
                      repo:         g.repo,
                      severity:     severityText,
                      ref:          v.ref,
                      type:         v.refType,
                      protected:    v.protected ? "Yes" : "No",
                      mergeCommits: `+${extraCount} more (not shown)`,
                    });
                    styleRow(row, rowFill);
                    row.font = { italic: true };
                    excelRow++;
                  }

                  const refEndRow = excelRow - 1;
                  if (refEndRow > refStartRow) {
                    sheet.mergeCells(refStartRow, 3, refEndRow, 3); // Ref
                    sheet.mergeCells(refStartRow, 4, refEndRow, 4); // Type
                    sheet.mergeCells(refStartRow, 5, refEndRow, 5); // Protected
                  }
                  if (v.protected) {
                    sheet.getCell(refStartRow, 3).font = { bold: true };
                  }
                }

                const groupEndRow = excelRow - 1;

                // Real merged cells — the Excel-native equivalent of the
                // blank-continuation-row trick the Markdown table needs.
                if (groupEndRow > groupStartRow) {
                  sheet.mergeCells(groupStartRow, 1, groupEndRow, 1); // Repo
                  sheet.mergeCells(groupStartRow, 2, groupEndRow, 2); // Severity
                }

                const severityCell = sheet.getCell(groupStartRow, 2);
                severityCell.fill      = { type: "pattern", pattern: "solid", fgColor: { argb: badgeFill } };
                severityCell.font      = { bold: true, color: { argb: badgeFont } };
                severityCell.alignment = { vertical: "middle", horizontal: "center", wrapText: true };

                sheet.getCell(groupStartRow, 1).alignment = { vertical: "middle", wrapText: true };
              }

              sheet.autoFilter = { from: "A1", to: "F1" };

              await workbook.xlsx.writeFile(xlsxPath);
              core.setOutput("xlsx_path", xlsxPath);
              core.info(`✅ Excel violations summary written to ${xlsxPath} (${allViolations.length} row(s))`);
            }

            const report = [...header, ...repoLines].join("\n");

            fs.writeFileSync(mdPath, report);
            core.setOutput("report_path", mdPath);

            if (process.env.GITHUB_STEP_SUMMARY) {
              fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, report + "\n");
            }

            core.info(`✅ Report written to ${mdPath} and the job summary (${allViolations.length} violation(s), ${protectedViolationCount} on protected refs)`);

      # --------------------------------------------------
      # Step 4: Upload Full Report
      # --------------------------------------------------
      # The file name itself (not just the artifact's display name) carries
      # the date and run number — steps.build_report.outputs.report_path —
      # so downloading reports from several runs into one folder never
      # overwrites an earlier one.

      - name: Upload Full Report
        uses: actions/upload-artifact@v7
        with:
          name:           non-linear-refs-report
          path:           ${{ steps.build_report.outputs.report_path }}
          retention-days: 30

      # --------------------------------------------------
      # Step 5: Upload Excel Violations Summary
      # --------------------------------------------------
      # Only the violations rollup table (not the full per-repo detail) —
      # as an actual .xlsx this time, so the color-coding and merged repo/
      # severity cells requested for the Markdown table (only approximated
      # there — GitHub strips row colors and Markdown has no real rowspan)
      # can be the real thing: true merged cells and true cell fill colors.
      # No `if: always()` here — matches "Upload Full Report" right below,
      # which also has none: if the report-building step fails outright,
      # neither artifact uploads, rather than one surviving and the other
      # not. On top of that, `has_violations` (set by that step) skips this
      # one outright on an ordinary zero-violations run — no .xlsx was ever
      # written, so there's nothing to even attempt uploading, rather than
      # running the step just to have it warn about a file that was never
      # going to exist. `if-no-files-found: warn` stays on as a safety net
      # for the one case that condition doesn't cover: has_violations came
      # back true but the file still isn't there for some other reason.

      - name: Upload Excel Violations Summary
        if: success() && steps.build_report.outputs.has_violations == 'true'
        uses: actions/upload-artifact@v7
        with:
          name:               non-linear-refs-violations-xlsx
          path:               ${{ steps.build_report.outputs.xlsx_path }}
          retention-days:     30
          if-no-files-found:  warn
